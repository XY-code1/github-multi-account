# 外部通知配置示例
# 复制为 settings.yaml 后填入真实信息：
#   cp config/settings.example.yaml config/settings.yaml
#
# 支持 4 种渠道（type）：
#   bark       —— iOS Bark，url 形如 https://api.day.app/<你的key>
#   webhook    —— 通用 Webhook，POST JSON {title, body, url}
#   serverchan —— Server酱，url 形如 https://sctapi.ftqq.com/<SENDKEY>.send
#   wecom      —— 企业微信机器人，url 形形如 https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=<key>
#
# enabled 为 true 才会推送。程序后台每 5 分钟检查一次 PR / Issue 数量变化。
#
# 注意：settings.yaml 已在 .gitignore 中，不会被提交。

channels:
  - type: bark
    name: iPhone
    url: https://api.day.app/xxxxxxxxxxxxxxxxxxxx
    enabled: true

  - type: serverchan
    name: Server酱
    url: https://sctapi.ftqq.com/SENDKEY.send
    enabled: false

  - type: wecom
    name: 企业微信
    url: https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxxx
    enabled: false

  - type: webhook
    name: 自建
    url: https://example.com/your-hook
    enabled: false
