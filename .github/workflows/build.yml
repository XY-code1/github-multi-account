name: Build Windows exe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go-app/go.mod

      - name: Sync frontend assets
        run: |
          mkdir -p go-app/assets/static
          cp -r static/. go-app/assets/static/
          cp templates/index.html go-app/assets/index.html

      - name: Verify assets are in sync
        run: |
          if ! git diff --exit-code -- go-app/assets; then
            echo "::error::go-app/assets 与 static/、templates/ 不同步。请运行 go-app/build.bat 后提交同步后的 assets。"
            exit 1
          fi

      - name: Run Go tests
        working-directory: go-app
        run: go test ./...

      - name: Build Windows exe
        run: |
          cd go-app
          GOOS=windows GOARCH=amd64 go build -ldflags "-H windowsgui -s -w" -o "GitHub仪表盘.exe" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-dashboard-windows
          path: go-app/GitHub仪表盘.exe
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-dashboard-windows
      - uses: softprops/action-gh-release@v2
        with:
          files: GitHub仪表盘.exe
