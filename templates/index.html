<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub 多账号状态仪表盘</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 16 16" width="24" height="24" fill="currentColor" aria-hidden="true">
          <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path>
        </svg>
      </div>
      <div class="brand-text">
        <h1>GitHub 账号状态</h1>
        <p>多账号仪表盘</p>
      </div>
    </div>
    <div class="topbar-actions">
      <span id="lastRefresh" class="last-refresh"></span>
      <button id="refreshBtn" class="btn" title="刷新全部账号">
        <span class="btn-icon">⟳</span> 刷新
      </button>
      <button id="addBtn" class="btn btn-primary">
        <span class="btn-icon">＋</span> 添加账号
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-head">
        <h2>账号</h2>
        <span id="accountCount" class="count-badge">0</span>
      </div>
      <div id="accountList" class="account-list"></div>
    </aside>

    <main class="main">
      <div id="emptyState" class="empty">
        <div class="empty-icon">◱</div>
        <h3>还没有配置账号</h3>
        <p>点击右上角「添加账号」，或使用 <code>config/accounts.yaml</code> 配置后重启。</p>
      </div>

      <div id="detail" class="detail hidden">
        <div class="detail-header">
          <img id="avatar" class="avatar" alt="avatar">
          <div class="detail-id">
            <h2 id="detailName">—</h2>
            <p id="detailMeta" class="detail-meta">—</p>
          </div>
          <span id="statusBadge" class="status-badge">—</span>
        </div>

        <div class="stats">
          <div class="stat-card">
            <span class="stat-num" id="statReview">0</span>
            <span class="stat-label">待我 Review 的 PR</span>
          </div>
          <div class="stat-card">
            <span class="stat-num" id="statMyPr">0</span>
            <span class="stat-label">我发起的 PR</span>
          </div>
          <div class="stat-card">
            <span class="stat-num" id="statIssue">0</span>
            <span class="stat-label">分配给我的 Issue</span>
          </div>
          <div class="stat-card">
            <span class="stat-num" id="statEvents">0</span>
            <span class="stat-label">最近动态</span>
          </div>
        </div>

        <div class="tabs" id="tabs">
          <button class="tab active" data-tab="review">待处理 PR</button>
          <button class="tab" data-tab="mypr">我的 PR</button>
          <button class="tab" data-tab="issues">分配 Issue</button>
          <button class="tab" data-tab="events">仓库动态</button>
          <button class="tab" data-tab="repos">仓库</button>
        </div>

        <div id="tabContent" class="tab-content"></div>
      </div>
    </main>
  </div>

  <div id="modal" class="modal-overlay hidden">
    <div class="modal">
      <h3>添加账号</h3>
      <p class="modal-hint">支持 <a href="https://github.com/settings/tokens" target="_blank" rel="noopener">Classic Token</a> 或 Fine-grained Token。</p>
      <label class="field">
        <span>显示名称（可选）</span>
        <input id="fLabel" type="text" placeholder="例如：主账号">
      </label>
      <label class="field">
        <span>GitHub 用户名</span>
        <input id="fUsername" type="text" placeholder="例如：XY-code1">
      </label>
      <label class="field">
        <span>Personal Access Token</span>
        <input id="fToken" type="password" placeholder="ghp_ 或 github_pat_ 开头" autocomplete="off">
      </label>
      <div id="testResult" class="test-result"></div>
      <div class="modal-actions">
        <button id="testBtn" class="btn">测试连接</button>
        <span class="spacer"></span>
        <button id="cancelBtn" class="btn">取消</button>
        <button id="saveBtn" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/static/app.js"></script>
</body>
</html>
